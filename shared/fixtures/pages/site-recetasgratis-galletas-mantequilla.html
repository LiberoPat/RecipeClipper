<script type="application/ld+json">{"@context":"https://schema.org/","@type":"Recipe","name":"Receta de Galletas de mantequilla caseras","description":"Las galletas de mantequilla son toda una delicia, además de fáciles de preparar. Puedes elaborarlas en casa y decorarlas con merengue, glasa real o fondant. Así mismo, son ideales para una fiesta de cumpleaños, baby shower, San Valentín o cualquier celebración.Si quieres aprender cómo hacer galletas de mantequilla caseras y fáciles, en RecetasGratis te proporcionamos gran variedad de recetas. ¡Vamos allá!","author":{"@type":"Person","name":"Clara Inés Rodríguez","url":"https://recetas.elperiodico.com/usuarios/267451.html"},"image":["https://cdn0.recetasgratis.net/es/posts/3/5/5/galletas_de_mantequilla_caseras_31553_1200.jpg"],"totalTime":"PT45M","recipeYield":12,"recipeCategory":"Merienda","recipeIngredient":["2 huevos","2½ tazas de harina","1 cucharadita de esencia de vainilla","1 cucharadita de polvo de hornear (levadura química tipo Royal)","100 gramos de mantequilla","1 taza de azúcar"],"recipeInstructions":[{"@type":"HowToStep","text":"Para empezar con la preparación de las galletas caseras de mantequilla coge un recipiente y mezcla la mantequilla a temperatura ambiente con el azúcar. Este proceso lo puedes hacer a mano con una espátula o varillas eléctricas. Verás cómo la mantequilla se va aclarando, formando una masa muy cremosa."},{"@type":"HowToStep","text":"El siguiente paso es añadir los huevos y la vainilla. Continúa removiendo con la espátula hasta conseguir que estos se integren por completo. Si se te hace muy complicado amasar las galletas de mantequilla a mano puedes usar una varillas eléctricas, pero no deberías tener problemas."},{"@type":"HowToStep","text":"Deja el bol con la masa a un lado y, aparte, tamiza la harina junto con el polvo de hornear (levadura química). Este paso es muy importante a la hora de hacer galletas caseras porque precisamente esto es lo que nos asegurará que no queden grumos y obtengamos una masa suave y homogénea.Cuando lo hayas hecho, ve añadiendo poco a poco la harina en la preparación y revuelve hasta que se integre todo por completo."},{"@type":"HowToStep","text":"Cuando tengas la masa de las galletas de mantequilla fáciles ya lista, el siguiente paso será envolverla en papel transparente o papel film y guardarla en la nevera durante una media hora aproximadamente. Lo ideal es formar una bola o varias pequeñas."},{"@type":"HowToStep","text":"Pasado este tiempo, ya podrás sacar la masa de la nevera. Para trabajarla, esparce un poco de harina sobre una superficie plana y extiéndela con ayuda de un rodillo. Haz las galletas de mantequilla del grosor que quieras y córtalas con ayuda de un molde con la forma que más te guste o con un vaso para hacer galletas redondas. Aprovecha y ve precalentando el horno a 180 ºC."},{"@type":"HowToStep","text":"Coloca las galletas de mantequilla caseras sobre una bandeja de horno forrada con papel vegetal y hornéalas durante 15 minutos, o hasta que estén doradas. Este tipo de galletas se hacen muy rápido, por lo que deberás vigilar el horno por si requieren de menos tiempo."},{"@type":"HowToStep","text":"Cuando estén listas, saca la bandeja del horno. Notarás que las galletas de mantequilla están un poco blandas, no te preocupes porque es normal. Lo mejor es dejarlas enfriar sobre una rejilla, ya verás que en cuanto se enfrían se tornan crujientes. Eso sí, vigila no quemarte, así que usa siempre una espátula para sacar las galletas recién hechas de la bandeja."},{"@type":"HowToStep","text":"Lo mejor de la receta de galletas de mantequilla caseras es que siempre puedes hacerla a tu manera, darle las formas y tamaños que más te gusten para sorprender a tus amigos y familiares. Y si te gusta la repostería, anímate y decorar tus galletitas de manteca y cuéntanos cómo te han quedado."},{"@type":"HowToStep","text":"Si quieres ver la preparación con más detalle para que no te pierdas ni un solo instante, puedes mirar nuestro vídeo donde preparamos la receta de galletas de mantequilla fáciles. ¡A hornear!"}],"publisher":{"@type":"Organization","name":"Recetas Gratis","url":"https://recetas.elperiodico.com","logo":{"@type":"ImageObject","url":"https://recetas.elperiodico.com/img/web/recetasgratis/logo/jsonld/es.png","width":179,"height":60},"sameAs":["https://www.facebook.com/RecetasGratis","https://www.twitter.com/recetaGratis","https://www.youtube.com/channel/UCmfdrPuxgWiNoU7JpUFlQOQ?sub_confirmation=1","https://www.instagram.com/RecetasGratis","https://pinterest.com/recetasg","https://www.tiktok.com/@recetasgratis"]}}</script>
