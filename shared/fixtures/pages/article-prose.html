<body>
<article>
<h1>My grandmother's pancakes</h1>
<p>She used 2 cups of flour, 2 eggs and 1 cup of milk, and never measured anything else.</p>
<p>Whisk it all together and let it rest for 10 minutes.</p>
<p>Fry the pancakes in butter, 2 minutes a side, and serve them with lemon and sugar.</p>
