<h1>What's in a good pantry</h1>
<p>A well-stocked pantry for two people holds roughly:</p>
<ul>
<li>2 kg rice</li>
<li>1 kg dried pasta</li>
<li>6 tins of tomatoes</li>
<li>1 litre olive oil</li>
</ul>
<h2>Where to keep it</h2>
<p>Somewhere cool and dark.</p>
