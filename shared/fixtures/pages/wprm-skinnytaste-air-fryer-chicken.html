er-chicken-breast\/#faq-question-1746542080239","position":2,"url":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/#faq-question-1746542080239","name":"Do I really need to brine the chicken?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"No, it's optional—but highly recommended! Brining makes a big difference in how juicy and flavorful the chicken turns out.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/#faq-question-1746542111113","position":3,"url":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/#faq-question-1746542111113","name":"Can I use table salt instead of kosher salt for the brine?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"Yes, but use less—about half the amount—as table salt is more concentrated than kosher salt.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Recipe","name":"Air Fryer Chicken Breast","author":{"@id":"https:\/\/www.skinnytaste.com\/#\/schema\/person\/d30ee2b4f0b2b8cff8d010fbf4228b72"},"description":"Tender, juicy chicken breast made in the air fryer—high-protein, healthy, and packed with flavor!","datePublished":"2019-06-09T12:24:25+00:00","image":["https:\/\/www.skinnytaste.com\/wp-content\/uploads\/2019\/06\/How-To-Make-Juicy-Air-Fryer-Chicken-Breasts-6.jpg","https:\/\/www.skinnytaste.com\/wp-content\/uploads\/2019\/06\/How-To-Make-Juicy-Air-Fryer-Chicken-Breasts-6-500x500.jpg","https:\/\/www.skinnytaste.com\/wp-content\/uploads\/2019\/06\/How-To-Make-Juicy-Air-Fryer-Chicken-Breasts-6-500x375.jpg","https:\/\/www.skinnytaste.com\/wp-content\/uploads\/2019\/06\/How-To-Make-Juicy-Air-Fryer-Chicken-Breasts-6-480x270.jpg"],"video":{"name":"How To Make Perfect Air Fryer Chicken Breast – No Breading!","description":"How To Make Perfect Air Fryer Chicken Breast – No Breading!\n\nPrint full recipe:","uploadDate":"2020-01-11T17:04:28+00:00","duration":"PT53S","thumbnailUrl":"https:\/\/i.ytimg.com\/vi\/7bsHFQTF_Wo\/hqdefault.jpg","embedUrl":"https:\/\/www.youtube.com\/embed\/7bsHFQTF_Wo?feature=oembed","contentUrl":"https:\/\/www.youtube.com\/watch?v=7bsHFQTF_Wo","@type":"VideoObject"},"recipeYield":["4"],"prepTime":"PT5M","cookTime":"PT10M","totalTime":"PT75M","recipeIngredient":["kosher salt (*see notes)","4 small boneless skinless chicken breasts (about 6 ounces each)","olive oil spray","3\/4 teaspoon garlic powder","3\/4 teaspoon onion powder","1\/2 teaspoon dried parsley","1\/2 teaspoon smoked paprika","1\/8  cayenne pepper"],"recipeInstructions":[{"@type":"HowToSection","name":"Air Fryer Method:","itemListElement":[{"@type":"HowToStep","text":"Pound the thicker end of the chicken to make both sides leveled out so they cook evenly.","name":"Pound the thicker end of the chicken to make both sides leveled out so they cook evenly.","url":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/#wprm-recipe-51968-step-0-0"},{"@type":"HowToStep","text":"Fill a large bowl with 6 cups of lukewarm water and add 1\/4 cup Diamond Crystal kosher salt, stir to dissolve.","name":"Fill a large bowl with 6 cups of lukewarm water and add 1\/4 cup Diamond Crystal kosher salt, stir to dissolve.","url":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/#wprm-recipe-51968-step-0-1"},{"@type":"HowToStep","text":"Add the chicken breasts to the water and let them sit, refrigerated 1 to 1 1\/2 hours to brine. Remove from water, pat dry with paper towels and discard the water.","name":"Add the chicken breasts to the water and let them sit, refrigerated 1 to 1 1\/2 hours to brine. Remove from water, pat dry with paper towels and discard the water.","url":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/#wprm-recipe-51968-step-0-2"},{"@type":"HowToStep","text":"In a small bowl combine 3\/4 teaspoon salt, with the remaining spices. Spritz the chicken with oil and rub all over, then rub the spice mix over the chicken.","name":"In a small bowl combine 3\/4 teaspoon salt, with the remaining spices. Spritz the chicken with oil and rub all over, then rub the spice mix over the chicken.","url":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/#wprm-recipe-51968-step-0-3"},{"@type":"HowToStep","text":"Add the chicken to the air fryer basket and air fry in batches 380F 5 minutes on each side, 10 minutes total until browned on the outside and cooked through on the inside. See notes below for larger breasts.","name":"Add the chicken to the air fryer basket and air fry in batches 380F 5 minutes on each side, 10 minutes total until browned on the outside and cooked through on the inside. See notes below for larger breasts.","url":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/#wprm-recipe-51968-step-0-4"}]},{"@type":"HowToSection","name":"Oven Method:","itemListElement":[{"@type":"HowToStep","text":"Preheat the oven to 350F. Heat an oven safe or cast iron skillet over high heat for 5 minutes until it is very hot.","name":"Preheat the oven to 350F. Heat an oven safe or cast iron skillet over high heat for 5 minutes until it is very hot.","url":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/#wprm-recipe-51968-step-1-0"},{"@type":"HowToStep","text":"Place the chicken on the hot skillet, and cook for 1 minute. Turn, and cook 1 minute on other side.","name":"Place the chicken on the hot skillet, and cook for 1 minute. Turn, and cook 1 minute on other side.","url":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/#wprm-recipe-51968-step-1-1"},{"@type":"HowToStep","text":"Transfer skillet to the oven and bake until no longer pink in the center and the juices run clear, about 8 to 10 minutes. The safe minimum internal temperature for cooked chicken breast is 165°F (73.9°C) as measured with a food thermometer.","name":"Transfer skillet to the oven and bake until no longer pink in the center and the juices run clear, about 8 to 10 minutes. The safe minimum internal temperature for cooked chicken breast is 165°F (73.9°C) as measured with a food thermometer.","url":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/#wprm-recipe-51968-step-1-2"}]}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.67","ratingCount":"156","reviewCount":"15"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Omg this is so good! I’m normally not a fan of grilled or oven baked breast because of how dry and flavor is it is this had just the right amount of spice and flavor and it was so juicy and now I’m trying to figure out what to do with the other breast because I just ate one and the other ones in the fridge so I’m gonna make some sort of salad or something with it. Absolutely amazing.","author":{"@type":"Person","name":"Kim"},"datePublished":"2025-12-12"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"4"},"reviewBody":"The chicken was definitely tender. The seasonings were good, but I would omit the additional salt. Although I rinsed the chicken well after brining, it was still saltier than I would have liked. I will make this again, but without the additional salt.","author":{"@type":"Person","name":"Georgette"},"datePublished":"2025-11-21"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"AGAIN, your recipe turned out GREAT!  A bit salty, so next time I will rinse the chicken breasts before patting them dry, but it was the first time I have ever enjoyed eating a chicken breast!  Juicy, so tender I could cut it with a fork, tasty.  My family and I just loved this recipe.  THANK you!!!!!!!","author":{"@type":"Person","name":"Estella"},"datePublished":"2025-09-06"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Have searched for years for a juicy chicken recipe and finally found this one!! Will not cook a breast any other way than as directed by this recipe. Thank you for sharing!","author":{"@type":"Person","name":"Diane"},"datePublished":"2025-06-01"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"So good, the whole family loves it","author":{"@type":"Person","name":"Jessi"},"datePublished":"2025-04-16"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"The brine was easy and delicious not at all salty. My family loved the tenderness of the chicken and cooking it in the air fryer was so easy.","author":{"@type":"Person","name":"Marie"},"datePublished":"2025-02-07"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Super easy, tasted great, and chicken was really moist.","author":{"@type":"Person","name":"Robin"},"datePublished":"2025-01-04"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This was delicious. I had Morton’s kosher salt so I used an eighth of a cup to 6 cups of water. It did not seem salty to me. I used Tones Rosemary garlic seasoning I was a little worried because that seasoning does have salt in it, but it was just excellent!","author":{"@type":"Person","name":"KimS"},"datePublished":"2024-12-10"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"4"},"reviewBody":"This was good, but too salty for my taste. But that could be because I used Morton's Kosher salt instead of Diamond Crystal. Gina did try to warn me!","author":{"@type":"Person","name":"Courtenay"},"datePublished":"2024-11-19"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Oh, my gosh! How did I never try this recipe?! It was fairly quick and super easy. My entire family loved it and I can imagine lots of ways to use leftovers. I cooked the breasts a bit too long, but I’ll adjust for next time and they were still delicious!","author":{"@type":"Person","name":"Karen"},"datePublished":"2024-11-10"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Delicious! I had never brined chicken before. We enjoyed the tender, moist chicken and I will be making this recipe and variations of it again.","author":{"@type":"Person","name":"Cindy"},"datePublished":"2024-11-10"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"3"},"reviewBody":"This is misleading not truly a complete air fryer chicken breast…. I would throw a tiny bit of sugar on this too.  But the cook times and brine according to recipe work.","author":{"@type":"Person","name":"Molly"},"datePublished":"2024-08-19"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"4"},"reviewBody":"The brining did make the chicken moist.  The seasonings were more intense than I really wanted for this chicken to be an adjunct to salad.  Also, maybe due to my air fryer or to using a silicone basket in the air fryer, my chicken got very little color \/ sear on it.  I would probably just follow the pan sear and finish in the oven variation next time.","author":{"@type":"Person","name":"AmyG"},"datePublished":"2024-08-12"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Did this tonight. I have a very small air fryer… one temp… 400 degrees. I modified the cook time based on this and the size of the chicken breast. I only did one. It will be at least two meals for me. Tasty. Looking forward to trying different herb combinations. Lovely to have a fairly quick way to do chicken breasts.","author":{"@type":"Person","name":"Lexie"},"datePublished":"2024-07-25"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"How are you SO good at every thing you do? Another amazing, easy recipe from your website. Thank you!! Tender and juicy, we make this at least three times a month for fajitas, \"grilled\" chicken salads, and  easy lunches. Thank you Gina!!","author":{"@type":"Person","name":"Susan"},"datePublished":"2024-07-24"}],"recipeCategory":["Dinner","Lunch"],"recipeCuisine":["American"],"keywords":"air fryer chicken breast, high protein, low carb, meal prep","nutrition":{"@type":"NutritionInformation","servingSize":"1 breast","calories":"208 kcal","carbohydrateContent":"1 g","proteinContent":"39 g","fatContent":"4.5 g","saturatedFatContent":"1 g","cholesterolContent":"124.5 mg","sodiumContent":"77 mg","fiberContent":"0.5 g","sugarContent":"0.5 g"},"@id":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/#recipe","isPartOf":{"@id":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/#article"},"mainEntityOfPage":"https:\/\/www.skinnytaste.com\/air-fryer-chicken-breast\/"}]}</script>
