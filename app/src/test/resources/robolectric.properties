# The Robolectric tests (#91): the Compose screen tests and the Room DAO tests.
# sdk: one Robolectric supports; it need not match targetSdk.
# qualifiers: Robolectric's default screen (320x470dp) leaves rows the screen tests assert on
# below the fold, so it is made taller. Not wider: at 360dp and up, an AlertDialog (List
# detail's Rename) never lets Compose go idle under Robolectric, and the test hangs.
# application: a plain Application, so no test builds the Hilt graph.
sdk=36
qualifiers=w320dp-h891dp
application=android.app.Application
