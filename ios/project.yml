name: RecipeClipper
options:
  bundleIdPrefix: com.liberopat.recipeclipper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    # Every upload to App Store Connect needs a higher build number than the last.
    CURRENT_PROJECT_VERSION: "1"
    # The Apple Developer Program Team ID (10 characters, from developer.apple.com →
    # Account → Membership details). The one place it is set; every target inherits it.
    # Blank builds for the simulator only. See docs/release.md.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  RecipeClipper:
    type: application
    platform: iOS
    sources:
      - path: RecipeClipper
      # The word and density tables shared with Android (#9), bundled as a tables/ folder.
      - path: ../shared/tables
        type: folder
        buildPhase: resources
    dependencies:
      - target: RecipeClipperShare
        embed: true
    # The App Group holds the database and settings the share extension also uses. Keep the
    # identifier in step with AppGroup.identifier and the extension's entitlements, and
    # register it on both App IDs (docs/release.md).
    entitlements:
      path: RecipeClipper/RecipeClipper.entitlements
      properties:
        com.apple.security.application-groups: [group.com.liberopat.recipeclipper]
    info:
      path: RecipeClipper/Info.plist
      properties:
        CFBundleDisplayName: Recipe Clipper
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - fraunces.ttf
          - karla.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.liberopat.recipeclipper
            CFBundleURLSchemes: [recipeclipper]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        # HTTPS only, which is exempt; saves answering the question on every upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liberopat.recipeclipper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  RecipeClipperShare:
    type: app-extension
    platform: iOS
    sources:
      - path: RecipeClipperShare
      # The import runs here, on the app's own code (dual target membership, not a copy):
      # the data layer, the share card and the theme it is drawn with. UserDefaults stays out,
      # so the extension uses no required-reason API and needs no privacy manifest. The
      # off-screen WebView fallback stays out too (memory): the extension has no rendered fetch.
      - path: RecipeClipper/Data
        excludes:
          - Local/UserDefaultsAppPreferences.swift
          - Remote/WebViewRenderedPageSource.swift
      - path: RecipeClipper/ShareImport
      - path: RecipeClipper/UI/Theme
      - path: RecipeClipper/UI/Common/Components.swift
    entitlements:
      path: RecipeClipperShare/RecipeClipperShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.liberopat.recipeclipper]
    info:
      path: RecipeClipperShare/Info.plist
      properties:
        CFBundleDisplayName: Recipe Clipper
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Must stay prefixed by the app's identifier.
        PRODUCT_BUNDLE_IDENTIFIER: com.liberopat.recipeclipper.share
        TARGETED_DEVICE_FAMILY: "1,2"
  RecipeClipperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RecipeClipperTests
    dependencies:
      - target: RecipeClipper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RecipeClipper.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RecipeClipper
        BUNDLE_LOADER: $(TEST_HOST)
  RecipeClipperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RecipeClipperUITests
    dependencies:
      - target: RecipeClipper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.liberopat.recipeclipper.uitests
        TEST_TARGET_NAME: RecipeClipper
schemes:
  RecipeClipper:
    build:
      targets:
        RecipeClipper: all
        RecipeClipperTests: [test]
        RecipeClipperUITests: [test]
    test:
      targets:
        - RecipeClipperTests
        - RecipeClipperUITests
