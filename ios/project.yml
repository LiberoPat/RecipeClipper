name: RecipeClipper
options:
  bundleIdPrefix: com.example.recipeclipper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  RecipeClipper:
    type: application
    platform: iOS
    sources:
      - path: RecipeClipper
    dependencies:
      - target: RecipeClipperShare
        embed: true
    info:
      path: RecipeClipper/Info.plist
      properties:
        CFBundleDisplayName: Recipe Clipper
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - fraunces.ttf
          - karla.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.example.recipeclipper
            CFBundleURLSchemes: [recipeclipper]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.recipeclipper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  RecipeClipperShare:
    type: app-extension
    platform: iOS
    sources:
      - path: RecipeClipperShare
    info:
      path: RecipeClipperShare/Info.plist
      properties:
        CFBundleDisplayName: Recipe Clipper
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.recipeclipper.share
        TARGETED_DEVICE_FAMILY: "1,2"
  RecipeClipperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RecipeClipperTests
      # The fixtures the Android tests read too (shared/fixtures): copied in as a folder, so
      # tests find them at fixtures/backup/<name>.json in the test bundle.
      - path: ../shared/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: RecipeClipper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RecipeClipper.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RecipeClipper
        BUNDLE_LOADER: $(TEST_HOST)
  RecipeClipperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RecipeClipperUITests
    dependencies:
      - target: RecipeClipper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.recipeclipper.uitests
        TEST_TARGET_NAME: RecipeClipper
schemes:
  RecipeClipper:
    build:
      targets:
        RecipeClipper: all
        RecipeClipperTests: [test]
        RecipeClipperUITests: [test]
    test:
      targets:
        - RecipeClipperTests
        - RecipeClipperUITests
