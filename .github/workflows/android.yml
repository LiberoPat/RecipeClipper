name: Android

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Skip the heavy job when a pull request touches none of its files. A skipped
  # job still reports its check (as skipped), so nothing waits on it. Pushes to
  # main always run.
  changes:
    name: Detect Android changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(app/|shared/|gradle/|build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradlew|\.github/workflows/android\.yml|\.github/scripts/)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android unit tests and lint
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The same JDK as Android Studio's bundled JBR: JetBrains Runtime 25.
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Lint fails the build on any error (AGP's default abortOnError).
      # Warnings are checked in the next step.
      - name: Unit tests, lint, device-test compile
        run: ./gradlew testDebugUnitTest lintDebug compileDebugAndroidTestKotlin

      # Lint reports two version advisories on purpose (CLAUDE.md). Any
      # other finding, at any severity, is real and fails the job.
      - name: Check lint found only version advisories
        run: python3 .github/scripts/check_lint.py app/build/reports/lint-results-debug.xml

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
