name: iOS UI tests

# About 30-35 minutes on five parallel shards, so not on every pull request: nightly, and on
# demand from the Actions tab (Run workflow) or `gh workflow run ios-ui-tests.yml --ref <branch>`.
# The classes are split by ios/scripts/ui-test-shard.sh; the run passes only if every shard does.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

# One run per branch at a time, so different pull requests test side by side instead of queuing
# behind each other (owner, 2026-11-20); a second run on the same branch waits its turn.
concurrency:
  group: ios-ui-tests-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  ios-ui:
    name: iOS UI tests (shard ${{ matrix.shard }})
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode
        run: xcodebuild -version

      # The classes this shard runs, packed by weight (ios/RecipeClipperUITests/ui-test-weights.json).
      # The script fails if a class would be in no shard or in two.
      - name: Pick this shard's tests
        id: shard
        run: |
          {
            echo 'only<<EOF'
            ios/scripts/ui-test-shard.sh ${{ matrix.shard }} ${{ strategy.job-total }}
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "### Shard ${{ matrix.shard }} of ${{ strategy.job-total }}" >> "$GITHUB_STEP_SUMMARY"
          ios/scripts/ui-test-shard.sh ${{ matrix.shard }} ${{ strategy.job-total }} 2>/dev/null \
            | sed 's/.*\//- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      # Each shard builds for itself: the five builds run side by side (about four minutes),
      # which beats one build plus uploading and downloading the products.
      - name: Build for testing
        working-directory: ios
        run: |
          xcodebuild build-for-testing \
            -project RecipeClipper.xcodeproj -scheme RecipeClipper \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData

      # A fresh simulator, fully booted before the run: the shared one hung at bootstrap and
      # crashed the test runner before any test ran (#296).
      - name: Boot a fresh simulator
        id: sim
        run: |
          udid=$(xcrun simctl create rc-ui-tests "iPhone 17" com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      # Each test gets five minutes (ten at most), so one stuck test fails alone instead of
      # running the job into its timeout. No diagnostics from the simulator: collecting them
      # after a failure timed out at ten minutes every time.
      - name: UI tests
        working-directory: ios
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          ONLY: ${{ steps.shard.outputs.only }}
        run: |
          run_tests() {
            xcodebuild test-without-building \
              -project RecipeClipper.xcodeproj -scheme RecipeClipper \
              -destination "id=$UDID" -derivedDataPath build/DerivedData \
              $ONLY -parallel-testing-enabled NO \
              -test-timeouts-enabled YES -collect-test-diagnostics never \
              -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 \
              -resultBundlePath "build/RecipeClipperUITests$1.xcresult" 2>&1 | tee "build/ui-tests$1.log"
            return "${PIPESTATUS[0]}"
          }
          run_tests "" && exit 0
          # The runner crashing before any test ran is the simulator, not a test: once more,
          # on the simulator rebooted.
          grep -q "never finished bootstrapping" build/ui-tests.log || exit 1
          echo "The test runner never started: rebooting the simulator and running once more."
          xcrun simctl shutdown "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          run_tests "-retry"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-results-${{ matrix.shard }}
          path: ios/build/*.xcresult
          if-no-files-found: ignore

      - name: Delete the simulator
        if: always() && steps.sim.outputs.udid != ''
        run: xcrun simctl delete "${{ steps.sim.outputs.udid }}"

  # One result for the run: it passes only if the whole suite did, every shard.
  ios-ui-result:
    name: iOS UI tests
    needs: ios-ui
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: |
          echo "The shards finished: ${{ needs.ios-ui.result }}"
          test "${{ needs.ios-ui.result }}" = "success"
