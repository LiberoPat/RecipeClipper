name: iOS

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The project needs Xcode 27 and the iOS 27 SDK. Select it explicitly so an
  # image update can't quietly switch Xcode under us.
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  # Skip the heavy job when a pull request touches none of its files. A skipped
  # job still reports its check (as skipped), so nothing waits on it. Pushes to
  # main always run.
  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(ios/|shared/|\.github/workflows/ios\.yml)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: iOS unit tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Unit tests
        working-directory: ios
        run: |
          xcodebuild test \
            -project RecipeClipper.xcodeproj -scheme RecipeClipper \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -only-testing:RecipeClipperTests \
            -resultBundlePath build/RecipeClipperTests.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-unit-test-results
          path: ios/build/RecipeClipperTests.xcresult
          if-no-files-found: ignore
